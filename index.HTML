<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>安心診所 - 呼吸道感染挑戰</title>
    <style>
        /* 基礎設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 10px;
            color: #333;
        }
        * { box-sizing: border-box; }
        
        /* 頂部資訊列 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0056b3;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* 主網格佈局 (支援手機與電腦) */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; } /* 手機版變成單行直排 */
        }

        /* 區塊樣式 */
        .panel {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .panel-title {
            margin-top: 0;
            font-size: 1.1em;
            color: #0056b3;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        /* 圖片區域 */
        .image-container {
            text-align: center;
            background-color: #eee;
            border-radius: 8px;
            padding: 10px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-container img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 4px;
        }

        /* 按鈕列表 */
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #eee;
        }
        .action-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.2s;
            /* 讓按鈕在手機上更容易點擊 */
            min-height: 44px; 
        }
        button:active { background-color: #45a049; transform: scale(0.98); }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        
        .btn-treatment { background-color: #e91e63; width: 100%; margin-bottom: 10px; }
        .btn-treatment:hover { background-color: #d81b60; }
        
        .result-text {
            flex-grow: 1;
            text-align: right;
            margin-left: 10px;
            font-weight: bold;
            color: #d32f2f;
        }

        /* 彈出視窗 (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .modal-content h2 { margin-top: 0; color: #333; }
        .modal-btn { background-color: #2196F3; margin-top: 20px; width: 100%; font-size: 1.1em; }
    </style>
</head>
<body>

    <!-- 頂部資訊列 -->
    <div class="header">
        <div>🏥 安心診所</div>
        <div id="scoreDisplay">得分：0</div>
    </div>

    <!-- 遊戲主體 -->
    <div class="container">
        
        <!-- 左上：咽喉照片 -->
        <div class="panel">
            <h3 class="panel-title">咽喉照片</h3>
            <div class="image-container">
                <!-- 若沒有讀取到圖片，會顯示 alt 的文字 -->
                <img id="throatImg" src="fig1.jpg" alt="[請將圖片命名為 fig1~fig4.jpg 放在同一個資料夾]">
            </div>
        </div>

        <!-- 右上：檢查處置 -->
        <div class="panel">
            <h3 class="panel-title">檢查處置</h3>
            <div class="action-row">
                <button id="btn_filmarray" onclick="doTest('filmarray')">Filmarray 檢驗</button>
                <div id="res_filmarray" class="result-text"></div>
            </div>
            <div class="action-row">
                <button id="btn_strep" onclick="doTest('strep')">鏈球菌快篩</button>
                <div id="res_strep" class="result-text"></div>
            </div>
            <div class="action-row">
                <button id="btn_covid" onclick="doTest('covid')">新冠快篩</button>
                <div id="res_covid" class="result-text"></div>
            </div>
            <div class="action-row">
                <button id="btn_flu" onclick="doTest('flu')">流感快篩</button>
                <div id="res_flu" class="result-text"></div>
            </div>
        </div>

        <!-- 左下：問診選項 -->
        <div class="panel">
            <h3 class="panel-title">問診選項</h3>
            <div class="action-row">
                <button id="btn_family" onclick="askQuestion('family')">家人朋友有無相同症狀？</button>
                <div id="res_family" class="result-text"></div>
            </div>
            <div class="action-row">
                <button id="btn_ache" onclick="askQuestion('ache')">有無全身痠痛？</button>
                <div id="res_ache" class="result-text"></div>
            </div>
            <div class="action-row">
                <button id="btn_lymph" onclick="askQuestion('lymph')">有無脖子淋巴結腫大？</button>
                <div id="res_lymph" class="result-text"></div>
            </div>
        </div>

        <!-- 右下：給予治療 -->
        <div class="panel">
            <h3 class="panel-title">開立處置</h3>
            <button class="btn-treatment" onclick="treat('antibiotic')">💊 開立抗生素</button>
            <button class="btn-treatment" onclick="treat('covid_med')">💊 開立新冠藥物</button>
            <button class="btn-treatment" onclick="treat('flu_med')">💊 開立流感藥物</button>
            <button class="btn-treatment" onclick="treat('symptom_med')">💧 症狀治療</button>
        </div>

    </div>

    <!-- 彈出視窗：看診結果 -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">看診結果</h2>
            <p id="modalDesc" style="font-size: 1.1em; line-height: 1.5;"></p>
            <button id="modalBtn" class="modal-btn" onclick="nextAction()">下一位病患</button>
        </div>
    </div>

    <!-- JavaScript 遊戲邏輯 -->
    <script>
        // 遊戲狀態變數
        let score = 0;
        let isGameOver = false;
        let patient = {}; // 存放當前病患資料

        // 初始化遊戲
        function initGame() {
            score = 0;
            isGameOver = false;
            updateScoreUI();
            nextPatient();
        }

        // 生成下一位病患
        function nextPatient() {
            // 清空所有按鈕狀態與文字
            let btnIds = ['filmarray', 'strep', 'covid', 'flu', 'family', 'ache', 'lymph'];
            btnIds.forEach(id => {
                document.getElementById('btn_' + id).disabled = false;
                document.getElementById('res_' + id).innerText = '';
            });

            // 1. 決定疾病 (0-19扁桃腺, 20-39流感, 40-49新冠, 50-99腺病毒)
            let rand = Math.floor(Math.random() * 100);
            if (rand < 20) {
                patient.disease = 'BACTERIAL';
                patient.diseaseName = '細菌性扁桃腺炎';
            } else if (rand < 40) {
                patient.disease = 'FLU';
                patient.diseaseName = '流感病毒感染';
            } else if (rand < 50) {
                patient.disease = 'COVID';
                patient.diseaseName = '新冠病毒感染';
            } else {
                patient.disease = 'ADENO';
                patient.diseaseName = '腺病毒感染';
            }

            // 2. 決定症狀 (機率)
            patient.family = checkProb({ BACTERIAL: 0, FLU: 0.7, COVID: 0.5, ADENO: 0.3 }[patient.disease]);
            patient.ache = checkProb({ BACTERIAL: 0, FLU: 1.0, COVID: 0.8, ADENO: 0.5 }[patient.disease]);
            patient.lymph = checkProb({ BACTERIAL: 0.5, FLU: 0, COVID: 0, ADENO: 0 }[patient.disease]);

            // 3. 決定照片 (圖1~圖4)
            let imgRand = Math.random();
            let imgFile = "fig2.jpg"; // 預設圖2 (新冠100%是圖2)
            if (patient.disease === 'BACTERIAL') imgFile = imgRand < 0.5 ? "fig1.jpg" : "fig2.jpg";
            if (patient.disease === 'FLU') imgFile = imgRand < 0.5 ? "fig2.jpg" : "fig4.jpg";
            if (patient.disease === 'ADENO') imgFile = imgRand < 0.5 ? "fig2.jpg" : "fig3.jpg";
            
            document.getElementById('throatImg').src = imgFile;
        }

        // 輔助函式：機率判定
        function checkProb(probability) { return Math.random() < probability; }

        // 問診邏輯
        function askQuestion(type) {
            document.getElementById('btn_' + type).disabled = true; // 按下後停用
            let resObj = document.getElementById('res_' + type);
            
            if (type === 'family') resObj.innerText = patient.family ? "是" : "否";
            if (type === 'ache') resObj.innerText = patient.ache ? "是" : "否";
            if (type === 'lymph') resObj.innerText = patient.lymph ? "是" : "否";
        }

        // 檢查邏輯
        function doTest(type) {
            document.getElementById('btn_' + type).disabled = true; // 按下後停用
            let resObj = document.getElementById('res_' + type);
            
            if (type === 'filmarray') {
                if (Math.random() < 0.8) { resObj.innerText = "好貴(拒絕)"; } 
                else { resObj.innerText = patient.diseaseName; }
            }
            else if (type === 'strep') {
                if (Math.random() < 0.5) { resObj.innerText = "好貴(拒絕)"; } 
                else { resObj.innerText = (patient.disease === 'BACTERIAL') ? "陽性" : "陰性"; }
            }
            else if (type === 'covid') {
                resObj.innerText = (patient.disease === 'COVID') ? "陽性" : "陰性";
            }
            else if (type === 'flu') {
                if (patient.disease === 'FLU') {
                    resObj.innerText = (Math.random() < 0.7) ? "陽性" : "陰性";
                } else {
                    resObj.innerText = "陰性";
                }
            }
        }

        // 處置邏輯
        function treat(treatment) {
            let msg = "";
            let title = "看診結果";
            let correct = false;

            // 判斷結果
            if (patient.disease === 'BACTERIAL') {
                if (treatment === 'antibiotic') { correct = true; }
                else if (treatment === 'covid_med') {
                    msg = "濫用新冠藥物，被罰款3萬元！";
                    isGameOver = true;
                } else {
                    msg = "後來細菌感染變嚴重，家屬來抗議醫師誤診。";
                    isGameOver = true;
                }
            } 
            else if (patient.disease === 'COVID') {
                if (treatment === 'covid_med') { correct = true; }
                else {
                    msg = "後來新冠感染變嚴重，家屬來抗議醫師誤診。";
                    isGameOver = true;
                }
            }
            else if (patient.disease === 'FLU') {
                if (treatment === 'flu_med') { correct = true; }
                else if (treatment === 'covid_med') {
                    msg = "濫用新冠藥物，被罰款3萬元！";
                    isGameOver = true;
                } else {
                    msg = "後來流感感染變嚴重，病人不再信任這位醫師。";
                    // 沒得分，但繼續遊戲
                }
            }
            else if (patient.disease === 'ADENO') {
                if (treatment === 'symptom_med') { correct = true; }
                else if (treatment === 'covid_med') {
                    msg = "濫用新冠藥物，被罰款3萬元！";
                    isGameOver = true;
                }
                else if (treatment === 'antibiotic') {
                    msg = "濫用抗生素，被核扣5000元。";
                    // 沒得分，但繼續遊戲
                } else {
                    msg = "處置不精準，病人復原緩慢。"; // 若選到流感藥物
                }
            }

            // 處理得分與訊息顯示
            if (correct) {
                score += 100;
                msg = "病人症狀改善，很感謝醫師高診！";
                title = "治療成功！";
            } else {
                title = isGameOver ? "醫療疏失！遊戲結束" : "處置不當";
            }
            
            updateScoreUI();

            // 顯示彈出視窗
            let finalMsg = `<strong>真正診斷為：${patient.diseaseName}</strong><br><br>${msg}`;
            showModal(title, finalMsg, isGameOver);
        }

        // 更新分數 UI
        function updateScoreUI() {
            document.getElementById('scoreDisplay').innerText = `得分：${score}`;
        }

        // 控制彈出視窗
        function showModal(title, desc, gameOver) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerHTML = desc;
            
            let btn = document.getElementById('modalBtn');
            if (gameOver) {
                btn.innerText = "重新開始遊戲";
                btn.style.backgroundColor = "#f44336";
            } else {
                btn.innerText = "下一位病患";
                btn.style.backgroundColor = "#2196F3";
            }
            
            document.getElementById('resultModal').style.display = 'flex';
        }

        // 彈出視窗的按鈕事件
        function nextAction() {
            document.getElementById('resultModal').style.display = 'none';
            if (isGameOver) {
                initGame();
            } else {
                nextPatient();
            }
        }

        // 網頁載入後馬上開始第一局
        window.onload = initGame;
    </script>
</body>
</html>
